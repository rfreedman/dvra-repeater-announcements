name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      TTS_SKIP_DOTENV: "1"
      TTS_SESSION_SECRET: test-session-secret-for-pytest
    steps:
      - uses: actions/checkout@v6

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Pytest
        run: uv run pytest -q
