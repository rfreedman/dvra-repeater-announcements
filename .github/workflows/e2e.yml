name: E2E

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      TTS_SKIP_DOTENV: "1"
      TTS_SESSION_SECRET: test-session-secret-for-pytest
    steps:
      - uses: actions/checkout@v6

      - name: Install PortAudio (sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Install Chromium
        run: uv run playwright install chromium --with-deps

      - name: Browser tests
        run: uv run pytest -m e2e --browser chromium
