[project]
name = "dvra-repeater-announcements"
version = "0.2.5"
description = "Piper TTS repeater announcements with a FastAPI UI, scheduler, and DRA-36M radio control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "piper-tts>=1.7.0",
    "sounddevice>=0.5.1",
    "hidapi>=0.14.0",
    "numpy>=1.26.0,<3",
    "apscheduler>=3.10.4,<4",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.0.0",
    "psutil>=5.9",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

# The importable package is app/ at the repo root (not src/<name>/).
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.0",
]
