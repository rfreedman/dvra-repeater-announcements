<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="mast">
        <!-- p class="kicker"> </p -->
        <h1>W2ZQ Announcement Generator Voice Test</h1>
      </header>

      <section class="voice-row">
        <label class="label" for="voice">Voice</label>
        <select id="voice"></select>
      </section>

      <section class="controls" aria-label="Delivery">
        <div class="control">
          <div class="control-head">
            <label class="label" for="speed">Speech Rate</label>
            <span id="speed-value">1.00×</span>
          </div>
          <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1" />
        </div>
        <div class="control">
          <div class="control-head">
            <label class="label" for="pause">Sentence pause</label>
            <span id="pause-value">0.25s</span>
          </div>
          <input id="pause" type="range" min="0" max="1.5" step="0.05" value="0.25" />
        </div>
      </section>

      <section class="script">
        <label class="label" for="text">Announcement</label>
        <textarea
          id="text"
          rows="6"
          maxlength="5000"
          placeholder="Write what you want to hear…"
        ></textarea>
        <div class="script-meta">
          <span id="count">0 / 5000</span>
          <span id="status">Ready</span>
        </div>
      </section>

      <div class="actions">
        <button type="button" class="primary" id="speak">Speak</button>
        <button type="button" class="ghost" id="stop" disabled>Stop</button>
      </div>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
